services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: stayfinder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: stayfinder_local_admin
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - stayfinder_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stayfinder']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  stayfinder_data:
